<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wossol | المنصة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0ea5e9; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 20px; }
    
    .hidden { display: none !important; }
    
    /* شريط علوي */
    .top-bar { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 1.5rem; font-weight: 800; }
    .logo span { color: var(--primary); }
    .user-info { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.9rem; }
    
    /* حاويات الشاشات */
    .container { max-width: 500px; margin: 30px auto; padding: 0 20px; }
    .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
    
    /* النماذج */
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; background: var(--bg); }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    
    /* الأزرار */
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.2s; margin-bottom: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-danger { background: var(--danger); color: white; padding: 8px 15px; width: auto; margin: 0; font-size: 0.8rem; }
    
    /* رسائل التنبيه */
    .alert { padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; text-align: center; margin-bottom: 15px; display: none; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; display: block; }
    .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; display: block; }

    /* لوحة التحكم */
    .order-card { background: var(--bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .order-info h4 { margin-bottom: 5px; font-size: 1rem; }
    .order-info p { font-size: 0.85rem; color: var(--muted); }
    .badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
  </style>
</head>
<body>

  <!-- صندوق الأخطاء التشخيصي -->
  <div id="debugBox" style="color: red; text-align: center; font-weight: bold; padding: 5px;"></div>

  <div id="topBar" class="top-bar hidden">
    <div class="logo">wossol<span>.</span></div>
    <div class="user-info">
      <span id="userNameDisplay">...</span>
      <button id="btnLogout" class="btn-danger">خروج</button>
    </div>
  </div>

  <div class="container">
    <div id="globalMsg" class="alert"></div>

    <!-- 1. شاشة الدخول -->
    <div id="screenAuth">
      <div class="card" style="text-align: center;">
        <h1 style="color: var(--primary); margin-bottom: 5px;">wossol</h1>
        <p style="color: var(--muted); margin-bottom: 20px;">منصة التوصيل السريع والآمن</p>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="authPassword" placeholder="كلمة المرور">
        <button id="btnLogin" class="btn-primary">تسجيل الدخول</button>
        <button id="btnSignup" class="btn-outline">إنشاء حساب جديد</button>
      </div>
    </div>

    <!-- 2. شاشة إكمال البيانات -->
    <div id="screenSetup" class="hidden">
      <div class="card">
        <h2 style="margin-bottom: 15px;">أكمل بياناتك</h2>
        <input type="tel" id="setupPhone" placeholder="رقم الهاتف (06...)">
        <select id="setupRole">
          <option value="buyer">أنا مشتري</option>
          <option value="courier">أنا موصل</option>
        </select>
        <button id="btnSave" class="btn-primary">حفظ والمتابعة</button>
      </div>
    </div>

    <!-- 3. لوحة التحكم -->
    <div id="screenDashboard" class="hidden">
      <div id="buyerUI" class="hidden">
        <div class="card">
          <h3 style="margin-bottom: 15px;">اطلب شيئاً الآن</h3>
          <input type="text" id="orderItems" placeholder="ماذا تريد أن تشتري؟">
          <input type="number" id="orderCost" placeholder="سعر المشتريات (د.ج)" value="1000">
          <input type="number" id="orderFee" placeholder="عمولة التوصيل (د.ج)" value="200">
          <button id="btnCreateOrder" class="btn-primary">إرسال الطلب</button>
        </div>
        <h3 style="margin-bottom: 15px;">طلباتي السابقة:</h3>
        <div id="buyerOrdersList"></div>
      </div>

      <div id="courierUI" class="hidden">
        <h3 style="margin-bottom: 15px;">الطلبات المتاحة:</h3>
        <div id="courierOrdersList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // التقاط أي خطأ وعرضه على الشاشة
    window.onerror = function(msg) {
      document.getElementById('debugBox').innerText = "خطأ في الكود: " + msg;
      return false;
    };

    const supabase = window.supabase.createClient(
      'https://jnczjcxyossccdcpnuuw.supabase.co', 
      'sb_publishable_WjYd1nvzw9-Bqa6oqSBWpA_GyefxfY7'
    );

    let currentUser = null;
    let userProfile = null;

    function showMsg(text, isError = true) {
      const msgDiv = document.getElementById('globalMsg');
      msgDiv.innerText = text;
      msgDiv.className = isError ? 'alert alert-error' : 'alert alert-success';
      setTimeout(() => { msgDiv.className = 'alert'; }, 5000);
    }

    function hideScreens() {
      document.getElementById('screenAuth').classList.add('hidden');
      document.getElementById('screenSetup').classList.add('hidden');
      document.getElementById('screenDashboard').classList.add('hidden');
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        await checkUserProfile();
      } else {
        hideScreens();
        document.getElementById('screenAuth').classList.remove('hidden');
      }
    }

    async function doSignup() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if(!email || !password) return showMsg('أدخل البريد وكلمة المرور');

      showMsg('جاري إنشاء الحساب...', false);
      const { data, error } = await supabase.auth.signUp({ email, password });

      if (error) return showMsg(error.message);
      
      currentUser = data.user;
      await checkUserProfile();
    }

    async function doLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if(!email || !password) return showMsg('أدخل البريد وكلمة المرور');

      showMsg('جاري الدخول...', false);
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) return showMsg(error.message);
      
      currentUser = data.user;
      await checkUserProfile();
    }

    async function checkUserProfile() {
      const { data, error } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();

      if (error || !data || !data.phone) {
        hideScreens();
        document.getElementById('screenSetup').classList.remove('hidden');
      } else {
        userProfile = data;
        document.getElementById('userNameDisplay').innerText = userProfile.full_name || currentUser.email.split('@')[0];
        document.getElementById('topBar').classList.remove('hidden');
        loadDashboard();
      }
    }

    async function doSaveProfile() {
      const phone = document.getElementById('setupPhone').value;
      const role = document.getElementById('setupRole').value;
      if(!phone) return showMsg('أدخل رقم الهاتف');

      showMsg('جاري الحفظ...', false);
      
      const { error } = await supabase.from('profiles').upsert({
        id: currentUser.id,
        email: currentUser.email,
        full_name: currentUser.email.split('@')[0],
        phone: phone,
        role: role
      });

      if (error) return showMsg(error.message);
      
      showMsg('تم الحفظ بنجاح!', false);
      await checkUserProfile();
    }

    function loadDashboard() {
      hideScreens();
      document.getElementById('screenDashboard').classList.remove('hidden');

      if (userProfile.role === 'buyer') {
        document.getElementById('buyerUI').classList.remove('hidden');
        document.getElementById('courierUI').classList.add('hidden');
        fetchBuyerOrders();
      } else {
        document.getElementById('courierUI').classList.remove('hidden');
        document.getElementById('buyerUI').classList.add('hidden');
        fetchCourierOrders();
      }
    }

    async function doCreateOrder() {
      const items = document.getElementById('orderItems').value;
      const cost = parseFloat(document.getElementById('orderCost').value) || 0;
      const fee = parseFloat(document.getElementById('orderFee').value) || 0;
      if(!items) return showMsg('اكتب تفاصيل الطلب');

      showMsg('جاري إرسال الطلب...', false);
      const { error } = await supabase.from('orders').insert({
        buyer_id: currentUser.id,
        items: items,
        cost: cost,
        fee: fee,
        status: 'open'
      });

      if (error) return showMsg(error.message);
      
      showMsg('تم إرسال الطلب بنجاح!', false);
      document.getElementById('orderItems').value = '';
      fetchBuyerOrders();
    }

    async function fetchBuyerOrders() {
      const list = document.getElementById('buyerOrdersList');
      list.innerHTML = '<p style="color:var(--muted);">جاري التحميل...</p>';
      
      const { data, error } = await supabase.from('orders').select('*').eq('buyer_id', currentUser.id).order('created_at', { ascending: false });

      if (error || !data.length) {
        list.innerHTML = '<p style="color:var(--muted);">لا توجد طلبات سابقة.</p>';
        return;
      }

      list.innerHTML = data.map(order => `
        <div class="order-card">
          <div class="order-info">
            <h4>${order.items}</h4>
            <p>السعر: ${order.cost} د.ج | التوصيل: ${order.fee} د.ج</p>
          </div>
          <span class="badge">${order.status === 'open' ? 'مفتوح' : 'مقبول'}</span>
        </div>
      `).join('');
    }

    async function fetchCourierOrders() {
      const list = document.getElementById('courierOrdersList');
      list.innerHTML = '<p style="color:var(--muted);">جاري البحث عن طلبات...</p>';

      const { data, error } = await supabase.from('orders').select('*').eq('status', 'open').order('created_at', { ascending: false });

      if (error || !data.length) {
        list.innerHTML = '<p style="color:var(--muted);">لا توجد طلبات متاحة الآن.</p>';
        return;
      }

      list.innerHTML = data.map(order => `
        <div class="order-card">
          <div class="order-info">
            <h4>${order.items}</h4>
            <p>العمولة: ${order.fee} د.ج</p>
          </div>
          <button class="btn-primary" style="width:auto; padding: 8px 15px; margin:0;" onclick="acceptOrder(${order.id})">قبول</button>
        </div>
      `).join('');
    }

    async function acceptOrder(orderId) {
      showMsg('جاري قبول الطلب...', false);
      const { error } = await supabase.from('orders').update({
        status: 'accepted',
        courier_id: currentUser.id
      }).eq('id', orderId);

      if (error) return showMsg(error.message);

      showMsg('تم قبول الطلب!', false);
      fetchCourierOrders();
    }

    async function doLogout() {
      await supabase.auth.signOut();
      window.location.reload();
    }

    // --- ربط الأزرار بالكود (الطريقة المضمونة) ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnLogin').addEventListener('click', doLogin);
      document.getElementById('btnSignup').addEventListener('click', doSignup);
      document.getElementById('btnSave').addEventListener('click', doSaveProfile);
      document.getElementById('btnCreateOrder').addEventListener('click', doCreateOrder);
      document.getElementById('btnLogout').addEventListener('click', doLogout);
      
      init();
    });

    // جعل دالة القبول متاحة للنطاق العام لأنها تستخدم في HTML
    window.acceptOrder = acceptOrder;
  </script>
</body>
</html>
