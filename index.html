<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار بسيط</title>
</head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
  <h1>اختبار التفاعل</h1>
  <button id="myBtn" style="padding:20px; font-size:20px; cursor:pointer;">اضغط هنا</button>
  <p id="result" style="color: red; font-weight:bold; font-size:20px; margin-top:20px;">الزر لم يضغط بعد</p>

  <script>
    document.getElementById('myBtn').addEventListener('click', function() {
      document.getElementById('result').innerText = '✅ ممتاز! الزر يعمل والمتصفح يتفاعل.';
      document.getElementById('result').style.color = 'green';
    });
  </script>
</body>
</html>
