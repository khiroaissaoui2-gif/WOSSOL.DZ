<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشخيص النظام</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 20px; font-family: sans-serif; background: #fffbeb;">
  <h2>تشخيص الأخطاء (Diagnostics)</h2>
  <div id="log" style="background: white; border: 1px solid #ccc; padding: 15px; border-radius: 10px; min-height: 100px; font-family: monospace; direction: ltr; text-align: left; font-size:14px;">
    1. تم تحميل الصفحة.<br>
  </div>
  <button id="testBtn" style="margin-top: 20px; padding: 15px; font-size: 18px; width: 100%; background: #0ea5e9; color: white; border: none; border-radius: 10px; cursor:pointer;">اضغط للاختبار</button>

  <script>
    const logDiv = document.getElementById('log');
    function log(msg, color = 'black') {
      logDiv.innerHTML += `<span style="color:${color};">${msg}</span><br>`;
    }

    // التقاط أي خطأ يحدث في الصفحة
    window.onerror = function(message, source, lineno, colno, error) {
      log(`❌ خطأ عام: ${message} (سطر ${lineno})`, 'red');
      return false;
    };

    log('2. بدأ تشغيل الكود (Script started).');

    if (typeof window.supabase === 'undefined') {
      log('❌ مكتبة Supabase لم يتم تحميلها (CDN failed).', 'red');
    } else {
      log('✅ مكتبة Supabase تم تحميلها بنجاح.', 'green');
      
      try {
        const supabase = window.supabase.createClient(
          'https://jnczjcxyossckdcpnuuw.supabase.co', 
          'sb_publishable_WjYd1nvzw9-Bqa6oqSBWpA_GyefxfY7'
        );
        log('✅ تم تهيئة سوبابيس بنجاح.', 'green');
        
        document.getElementById('testBtn').addEventListener('click', async () => {
          log('⏳ تم الضغط على الزر. جاري محاولة إنشاء حساب وهمي...', 'blue');
          try {
            const { data, error } = await supabase.auth.signUp({ 
              email: 'test_'+Date.now()+'@test.com', 
              password: 'password123' 
            });
            if (error) {
              log(`❌ خطأ من سوبابيس: ${error.message}`, 'red');
            } else {
              log(`✅ نجاح! تم إنشاء الحساب. هل يوجد Session: ${data.session ? 'نعم' : 'لا (تأكيد البريد مفعل)'}`, 'green');
            }
          } catch (err) {
            log(`❌ خطأ في الـ Catch: ${err.message}`, 'red');
          }
        });

      } catch (e) {
        log('❌ خطأ أثناء تهيئة العميل: ' + e.message, 'red');
      }
    }
  </script>
</body>
</html>
