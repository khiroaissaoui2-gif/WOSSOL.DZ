<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wossol | لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #f8fafc; font-family: 'Tajawal', sans-serif; text-align: center; padding: 50px; margin: 0; }
    h1 { color: #0ea5e9; font-size: 2.5rem; margin-bottom: 5px; }
    span { color: #1e293b; }
    .card { background: white; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    button { margin-top:20px; padding:12px 24px; border:none; border-radius:10px; background:#ef4444; color:white; font-weight:bold; cursor:pointer; font-family: 'Tajawal', sans-serif;}
  </style>
</head>
<body>
  <div class="card">
    <h1>wossol<span>.</span></h1>
    <h2 id="welcome">جاري التحقق...</h2>
    <p>مرحباً بك في لوحة التحكم.</p>
    <button onclick="logout()">تسجيل الخروج</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://jnczjcxyossckdcpnuuw.supabase.co', 
      'sb_publishable_WjYd1nvzw9-Bqa6oqSBWpA_GyefxfY7'
    );
    
    async function check() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { 
        window.location.href = 'index.html'; 
        return; 
      }
      const name = session.user.user_metadata?.full_name || session.user.email;
      document.getElementById('welcome').textContent = 'مرحباً، ' + name;
    }
    
    async function logout() { 
      await supabase.auth.signOut(); 
      window.location.href = 'index.html'; 
    }
    
    check();
  </script>
</body>
</html>
