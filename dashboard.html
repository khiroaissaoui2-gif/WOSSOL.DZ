<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wossol | لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0ea5e9; --primary-dark: #0284c7; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    .top-bar { background: var(--card); padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 1.5rem; font-weight: 800; }
    .logo span { color: var(--primary); }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; justify-content: center; align-items: center; font-weight: 700; }
    .logout-btn { background: transparent; border: none; color: #ef4444; font-weight: 700; cursor: pointer; margin-left: 10px; }

    .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    
    .setup-screen { display: none; }
    .setup-screen h2 { margin-bottom: 20px; font-size: 1.3rem; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; color: var(--text); }
    input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; margin-bottom: 15px; background: var(--bg); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: var(--primary-dark); }

    .dashboard-screen { display: none; }
    .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
    .welcome-banner h2 { font-size: 1.4rem; margin-bottom: 5px; }
    .welcome-banner p { opacity: 0.9; font-size: 0.9rem; }
    
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .stat-box h3 { font-size: 1.5rem; color: var(--primary); }
    .stat-box p { font-size: 0.8rem; color: var(--muted); }

    .loader { text-align: center; padding: 50px; font-weight: bold; color: var(--muted); }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo">wossol<span>.</span></div>
    <div style="display: flex; align-items: center;">
      <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">خروج</button>
      <div class="user-avatar" id="avatar" style="display:none;">U</div>
    </div>
  </div>

  <div class="container">
    <div id="loadingScreen" class="loader">جاري تحميل بياناتك...</div>

    <!-- شاشة إكمال الملف الشخصي (الجديدة) -->
    <div id="setupScreen" class="card setup-screen">
      <h2>أهلاً بك في wossol! 👋</h2>
      <p style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">يرجى إكمال بياناتك لتبدأ باستخدام المنصة.</p>
      
      <label for="phone">رقم الهاتف</label>
      <input type="tel" id="phone" placeholder="06xxxxxxxx" required>

      <label for="role">كيف تريد استخدام المنصة؟</label>
      <select id="role">
        <option value="buyer">مشتري (أطلب منتجات)</option>
        <option value="courier">عامل توصيل (أوصل الطلبات)</option>
        <option value="seller">بائع / متجر (أعرض منتجات)</option>
      </select>

      <button class="btn-primary" onclick="saveProfile()">حفظ والبدء</button>
      <p id="setupError" style="color:#ef4444; font-size:0.85rem; margin-top:10px; text-align:center; display:none;"></p>
    </div>

    <!-- شاشة لوحة التحكم (بعد إكمال البيانات) -->
    <div id="dashboardScreen" class="dashboard-screen">
      <div class="welcome-banner">
        <h2 id="welcomeName">مرحباً بك!</h2>
        <p id="welcomeRole">دورك: ...</p>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <h3>0</h3>
          <p>طلباتي النشطة</p>
        </div>
        <div class="stat-box">
          <h3>0.0</h3>
          <p>تقييمي</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://jnczjcxyossckdcpnuuw.supabase.co', 
      'sb_publishable_WjYd1nvzw9-Bqa6oqSBWpA_GyefxfY7'
    );

    let currentUser = null;

    function getRoleName(role) {
      if (role === 'buyer') return 'مشتري';
      if (role === 'courier') return 'عامل توصيل';
      if (role === 'seller') return 'بائع';
      return 'غير محدد';
    }

    async function initDashboard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      
      currentUser = session.user;
      
      document.getElementById('logoutBtn').style.display = 'block';
      const avatar = document.getElementById('avatar');
      avatar.style.display = 'flex';
      
      const name = currentUser.user_metadata?.full_name || currentUser.email;
      avatar.textContent = name.charAt(0).toUpperCase();

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      document.getElementById('loadingScreen').style.display = 'none';

      if (!profile || !profile.phone) {
        document.getElementById('setupScreen').style.display = 'block';
      } else {
        document.getElementById('dashboardScreen').style.display = 'block';
        document.getElementById('welcomeName').textContent = 'مرحباً، ' + (profile.full_name || name);
        document.getElementById('welcomeRole').textContent = 'دورك: ' + getRoleName(profile.role);
      }
    }

    async function saveProfile() {
      const phone = document.getElementById('phone').value.trim();
      const role = document.getElementById('role').value;
      const errDiv = document.getElementById('setupError');
      
      if (!phone) {
        errDiv.textContent = 'يرجى إدخال رقم الهاتف';
        errDiv.style.display = 'block';
        return;
      }

      const btn = event.target;
      btn.textContent = 'جاري الحفظ...';
      btn.disabled = true;

      const { error } = await supabase
        .from('profiles')
        .upsert({
          id: currentUser.id,
          full_name: currentUser.user_metadata?.full_name || 'مستخدم',
          phone: phone,
          role: role
        });

      if (error) {
        errDiv.textContent = 'حدث خطأ: ' + error.message;
        errDiv.style.display = 'block';
        btn.textContent = 'حفظ والبدء';
        btn.disabled = false;
      } else {
        window.location.reload();
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    initDashboard();
  </script>
</body>
</html>
